<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfit Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h1>Capture Your Image</h1>
        <video id="video" width="320" height="240" autoplay></video> <br>
        <button id="captureButton">Capture Image</button><br><br>
        <canvas id="canvas" width="320" height="240" style="display: none;"></canvas>
        <form method="POST" action="/predict" enctype="multipart/form-data" id="uploadForm">
            <input type="hidden" name="image" id="imageData">
            <button type="submit" id="submitButton" style="display: none;">Submit Image</button>
        </form>
    </div>
    <script>
        const video = document.getElementById('video');
        const captureButton=document.getElementById('captureButton');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
     
        const imageDataField= document.getElementById('imageData');
        const submitButton = document.getElementById('submitButton');

        navigator.mediaDevices.getUserMedia({video:true})
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Error accessing camera:",err);
            });
            captureButton.addEventListener('click',() =>{
                context.drawImage(video,0,0,canvas.width,canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg');
                imageDataField.value = dataUrl;
                console.log("Bas64 Image Data:",dataUrl);
                submitButton.style.display ='inline-block';
            });
    </script>
    
</body>
</html>
